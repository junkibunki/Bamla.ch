# Baut Bamla.ch und lädt dist/ per rsync auf den Server (/var/www/bamla, ausgeliefert von Caddy).
# Benötigte Repository-Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: SSH einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Hochladen
        run: rsync -az --delete dist/ deploy@${{ secrets.DEPLOY_HOST }}:/var/www/bamla/

      # Multiplayer-Server (server/multiplayer.mjs + ws) nach ~/bamla-mp, systemd-User-Dienst neu starten
      - name: Multiplayer-Server
        run: |
          mkdir -p mp/node_modules
          cp server/multiplayer.mjs server/bamla-mp.service mp/
          cp -r node_modules/ws mp/node_modules/
          rsync -az --delete mp/ deploy@${{ secrets.DEPLOY_HOST }}:bamla-mp/
          ssh deploy@${{ secrets.DEPLOY_HOST }} 'export XDG_RUNTIME_DIR=/run/user/$(id -u); systemctl --user restart bamla-mp' \
            || echo "::warning::Dienst bamla-mp nicht neu gestartet – einmalige Einrichtung siehe README (Multiplayer)"
